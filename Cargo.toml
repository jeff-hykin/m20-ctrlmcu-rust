[package]
name = "m20-ctrlmcu"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "Deep Robotics M20 (Lynx) body control MCU on the AOS board's /dev/ttyS3: frame codec, LED / fill-light / fan / power commands, fan-speed and load-current replies, and a serial client that refuses power changes unless allowed"
license = "Apache-2.0"
repository = "https://github.com/jeff-hykin/m20-ctrlmcu-rust"
readme = "README.md"
keywords = ["robotics", "deeprobotics", "m20", "serial", "mcu"]
categories = ["science::robotics", "hardware-support", "parser-implementations"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "PROTOCOL.md", "LICENSE"]

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
